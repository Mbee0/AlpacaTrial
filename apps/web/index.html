<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trendline Research Platform</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1b2638;
      }

      #app-boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #1d2a3f 0%, #1a2638 100%);
        color: #d8e7ff;
        font-family: Inter, "Segoe UI", Roboto, sans-serif;
        z-index: 9999;
        opacity: 1;
        transition: opacity 180ms ease;
      }

      #app-boot.boot-hide {
        opacity: 0;
        pointer-events: none;
      }

      .boot-inner {
        display: grid;
        justify-items: center;
        gap: 0.45rem;
        font-size: 0.85rem;
      }

      .boot-wave {
        display: inline-flex;
        align-items: center;
        gap: 0.38rem;
      }

      .boot-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #9fc0f5;
        animation: boot-wave-dot 0.9s ease-in-out infinite;
      }

      .boot-dot:nth-child(2) {
        animation-delay: 0.12s;
      }

      .boot-dot:nth-child(3) {
        animation-delay: 0.24s;
      }

      @keyframes boot-wave-dot {
        0%,
        80%,
        100% {
          transform: translateY(0);
          opacity: 0.45;
        }
        40% {
          transform: translateY(-5px);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="app-boot" aria-live="polite">
      <div class="boot-inner">
        <div class="boot-wave" role="status" aria-label="Loading dashboard">
          <span class="boot-dot"></span>
          <span class="boot-dot"></span>
          <span class="boot-dot"></span>
        </div>
        <div>Loading trading dashboard…</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
